name: Overleaf guard

on:
  push:
    branches: [main]
    paths:
      - 'analysis/**'
      - 'data-code/**'

jobs:
  flag-code-change:
    if: contains(github.event.head_commit.message, 'Overleaf') || contains(github.event.head_commit.message, 'overleaf-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Flag code file changes
        run: |
          echo "Code files were modified by an Overleaf commit:"
          git diff --name-only HEAD~1 HEAD -- analysis/ data-code/
          echo ""
          echo "Revert with: git revert HEAD && git push"
          exit 1
